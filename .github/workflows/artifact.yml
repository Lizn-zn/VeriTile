name: Artifact

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
      - 'README_zh.md'
  pull_request:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
      - 'README_zh.md'
  workflow_dispatch:

jobs:
  check:
    name: Lean artifact checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Check artifact contract
        run: scripts/check-artifact.sh

      - name: Check audit and documentation regressions
        run: |
          lake env lean bench/tests/StatementAudit.lean
          python3 -m unittest discover -s scripts -p 'test_doc_api.py'
