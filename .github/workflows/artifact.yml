name: Artifact

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
      - 'README_zh.md'
  pull_request:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
      - 'README_zh.md'
  workflow_dispatch:

jobs:
  check:
    name: Lean artifact checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Check artifact contract with comparator
        run: scripts/check-artifact.sh

      - name: Check audit and documentation regressions
        run: |
          lake env lean bench/tests/StatementAudit.lean
          lake env lean bench/tests/KernelIOProjection.lean
          lake env lean bench/tests/ModuleSpecAudit.lean
          lake env lean bench/tests/ModuleHeadlineAudit.lean
          python3 -m unittest discover -s scripts -p 'test_audit_gates.py'
          python3 -m unittest discover -s scripts -p 'test_audit_shards.py'
          python3 -m unittest discover -s scripts -p 'test_doc_api.py'
          python3 -m unittest discover -s scripts -p 'test_coverage_review.py'
          python3 bench/coverage_review.py
          python3 scripts/test_check_comparator.py

      - name: Check representative standalone ports after library changes
        env:
          CHECK_PORTS_JOBS: 1
          AUDIT_TRUST_JOBS: 1
        run: |
          bash bench/check_ports.sh vector_addition mean_reduction quantize_global
          bash bench/audit_trust.sh vector_addition mean_reduction quantize_global
