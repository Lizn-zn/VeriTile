name: Bench audit

# TritonBench-G completion gates: comparator-backed trust audit (bench/audit_trust.sh),
# proof-gap manifest exact-match (bench/check_proof_gap_manifest.py), and the
# textual py<->lean faithfulness scans (bench/audit_tritonbench_g.sh).
#
# Elaboration and proof replay dominate runtime (parallelized in
# bench/audit_trust.sh), so this workflow is scoped to bench/ changes rather
# than every .lean touch; the weekly scheduled run catches drift introduced
# by library changes that never touch bench/.

on:
  push:
    branches:
      - main
    paths:
      - 'bench/**'
      - 'scripts/check_comparator.py'
      - 'scripts/comparator_common.py'
      - 'scripts/setup-comparator.sh'
      - 'scripts/kernel-manifest.tsv'
      - 'lean-toolchain'
      - '.github/actions/setup-comparator/**'
      - '.github/workflows/bench-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bench/**'
      - 'scripts/check_comparator.py'
      - 'scripts/comparator_common.py'
      - 'scripts/setup-comparator.sh'
      - 'scripts/kernel-manifest.tsv'
      - 'lean-toolchain'
      - '.github/actions/setup-comparator/**'
      - '.github/workflows/bench-audit.yml'
  schedule:
    # Weekly drift check (Monday 03:17 UTC) so library-only changes that
    # break bench ports or scans still surface within a week.
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Superseded runs on the same ref are dead weight on a single-machine runner;
# cancel them when a newer commit arrives.
concurrency:
  group: bench-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: TritonBench-G audit gates
    # Self-hosted runner with a user-local mathlib cache. Capacity can change;
    # the scripts choose concurrency from available CPU and memory. One audit
    # pass elaborates the ports with trust gates and replays their proofs through
    # comparator. A port elaboration pass alone took 47 minutes in PR #644.
    #
    # The repo is PUBLIC. A pull_request from a fork would otherwise execute
    # the fork's workflow code on this machine, so fork PRs are excluded at the
    # job level: pushes, schedule, dispatch, and same-repo PRs still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, veritile]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The audit script hard-fails without rg/python3; verify up front so a
      # misconfigured runner dies in seconds with a clear message.
      - name: Check required tools
        run: command -v rg && command -v python3

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Run TritonBench-G audit with comparator
        run: bench/audit_tritonbench_g.sh
