name: Bench audit

# TritonBench-G completion gates: port elaboration (bench/check_ports.sh),
# proof-gap manifest exact-match (bench/check_proof_gap_manifest.py), and the
# textual py<->lean faithfulness scans (bench/audit_tritonbench_g.sh).
#
# The elaboration pass dominates the runtime (parallelized in
# bench/check_ports.sh), so this workflow is scoped to bench/ changes rather
# than every .lean touch; the weekly scheduled run catches drift introduced
# by library changes that never touch bench/.

on:
  push:
    branches:
      - main
    paths:
      - 'bench/**'
      - '.github/workflows/bench-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bench/**'
      - '.github/workflows/bench-audit.yml'
  schedule:
    # Weekly drift check (Monday 03:17 UTC) so library-only changes that
    # break bench ports or scans still surface within a week.
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Superseded runs on the same ref are dead weight on a single-machine runner;
# cancel them when a newer commit arrives.
concurrency:
  group: bench-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: TritonBench-G audit gates
    # Self-hosted 96-core runner (dsp5): parallel port elaboration finishes
    # in minutes instead of the ~17min a 4-vCPU hosted runner needs, and the
    # user-local mathlib cache makes `lake exe cache get` near-instant. The
    # repo is private, so no fork-PR code reaches this machine.
    runs-on: [self-hosted, linux, x64, veritile]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The audit script hard-fails without rg/python3; verify up front so a
      # misconfigured runner dies in seconds with a clear message.
      - name: Check required tools
        run: command -v rg && command -v python3

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Run TritonBench-G audit
        run: bench/audit_tritonbench_g.sh
