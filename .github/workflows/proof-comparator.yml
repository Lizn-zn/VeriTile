name: Proof comparator integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prove.py'
      - 'scripts/prove.sh'
      - 'scripts/setup-comparator.sh'
      - 'scripts/test_prove.py'
      - 'lean-toolchain'
      - '.github/workflows/proof-comparator.yml'
  pull_request:
    paths:
      - 'scripts/prove.py'
      - 'scripts/prove.sh'
      - 'scripts/setup-comparator.sh'
      - 'scripts/test_prove.py'
      - 'lean-toolchain'
      - '.github/workflows/proof-comparator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build pinned official judge tools
        run: |
          scripts/setup-comparator.sh "$RUNNER_TEMP/veritile-proof-tools"
          echo "$RUNNER_TEMP/veritile-proof-tools/bin" >> "$GITHUB_PATH"
      - name: Start systemd user sandbox service
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
      - name: Exercise comparator acceptance and rejection
        run: python3 scripts/test_prove.py
