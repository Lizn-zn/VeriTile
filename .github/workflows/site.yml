name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'documents/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'VeriTile/**'
      - 'bench/tritonbench_g/**'
      - 'bench/examples/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'documents/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'VeriTile/**'
      - 'bench/tritonbench_g/**'
      - 'bench/examples/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit locked dependencies
        run: bun audit

      - name: Check documentation copies
        run: python3 scripts/sync-docs.py --check

      - name: Check recorded proof freshness
        run: python3 scripts/record-home-demo.py --check

      - name: Build site
        run: bun run build

      - name: Check site links
        run: python3 scripts/check-site.py

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
