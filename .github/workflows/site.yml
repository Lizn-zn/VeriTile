name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'documents/**'
      - 'lean-toolchain'
      - 'bench/tritonbench_g/**'
      - 'bench/examples/VectorAdd.lean'
      - 'bench/examples/FusedSiLUEquiv.lean'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check documentation copies
        run: python3 scripts/sync-docs.py --check

      - name: Build site
        run: bun run build

      - name: Check site links
        run: python3 scripts/check-site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
