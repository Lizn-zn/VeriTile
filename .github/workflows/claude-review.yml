name: Claude PR review

# Triggers:
# - PR comment containing "@claude" (typed by the maintainer)
# - PR review comment containing "@claude"
# Auto-on-every-PR is intentionally OFF to control LLM cost.
# Flip the `pull_request` trigger below back on if/when desired.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Uncomment to also auto-review every PR open / push:
  # pull_request:
  #   types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    # Only run when the comment is on a PR and contains "@claude".
    if: |
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@claude')
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')
        )
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Claude review prompt
        id: review_prompt
        run: |
          {
            echo 'prompt<<EOF'
            cat .github/claude-pr-review-prompt.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Project-specific guidance:
          prompt: ${{ steps.review_prompt.outputs.prompt }}
