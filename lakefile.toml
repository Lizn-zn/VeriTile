name = "veritile"
defaultTargets = ["VeriTile"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

# Lite target: Triton subset + worked examples without the GeLU error
# certificate. Routine kernel-verification work uses this; it skips the
# `VeriTile.Math.*` chain and ApproxGeLU's analysis-heavy proofs.
[[lean_lib]]
name = "VeriTile"
globs = [
  "VeriTile.Triton",
  "VeriTile.Triton.+",
  # Statement-audit commands only (lightweight, imports just `Lean`). The
  # TrustReport driver lives in VeriTileFull because it audits ApproxGeLU,
  # which pulls the heavy analysis chain the lite target deliberately skips.
  "VeriTile.Meta.Specification",
  "VeriTile.Meta.StatementAudit",
  "VeriTile.Meta.EquivDecompose",
  "VeriTile.Meta.FPProve",
  "VeriTile.Meta.Disprove",
  "VeriTile.Spec",
  # Worked-example KERNELS live in bench/examples/ (self-contained example
  # directories can separate kernels and their proofs). The library keeps shared
  # vocabulary (Common), pure-math spec files (AttentionForwardClosedForm,
  # FlashAttention2), and the multi-file FlashAttention1 stack (relocation
  # pending).
  "VeriTile.Examples.Common",
  "VeriTile.Examples.AttentionForwardClosedForm",
  "VeriTile.Examples.FlashAttention1",
  "VeriTile.Examples.FlashAttention1.+",
  "VeriTile.Examples.FlashAttention2",
]

# Math sub-library: Taylor and integral bounds for the GeLU error
# certificate. Pulls in heavy Mathlib analysis (`MeasureTheory`,
# `Analysis.Calculus.MeanValue`, …).
[[lean_lib]]
name = "VeriTileMath"
globs = ["VeriTile.Math.+"]

# Independent real-correctness and FP-equivalence specification examples.
[[lean_lib]]
name = "TritonBenchSpecExamples"
globs = ["bench.examples.+"]
roots = [
  "bench.examples.TritonBenchVectorAddition.Correct",
  "bench.examples.TritonBenchVectorAddition.FPEquiv",
]

# Full target: Lite + Math + ApproxGeLU. Build this when working on the
# GeLU error bound or before any release tagging.
#
# `VeriTile.Meta.TrustReport` (the generated whole-library trust gate — runs
# `#axiomsClean` on every proven library theorem) lives here because it imports
# ApproxGeLU. `lake build VeriTile.Meta.TrustReport` builds its dependencies and
# runs the audit in one step; keeping it out of the lite lib preserves the
# lite/full split.
[[lean_lib]]
name = "VeriTileFull"
globs = [
  "VeriTile.Examples.ApproxGeLU",
  "VeriTile.Examples.ApproxGeLU.+",
  "VeriTile.Meta.TrustReport",
]

