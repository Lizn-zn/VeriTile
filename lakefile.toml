name = "veritile"
defaultTargets = ["VeriTile"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

# Lite target: the neutral foundation + worked examples without the GeLU
# error certificate. Routine kernel-verification work uses this; it skips the
# GeLU analysis chain (`VeriTile.Math.GeluTaylor20*`, `RealErf`, `Tanh`) and
# ApproxGeLU's analysis-heavy proofs.
[[lean_lib]]
name = "VeriTile"
globs = [
  # Neutral core foundation (relocated out of `VeriTile.Triton.*`, #472).
  "VeriTile.Core.+",
  "VeriTile.Semantics.+",
  "VeriTile.Memory.+",
  "VeriTile.Float.+",
  "VeriTile.Launch.+",
  "VeriTile.Concurrency.+",
  "VeriTile.Kernel.+",
  "VeriTile.Compute",
  "VeriTile.ExternalCheck",
  # Pure-math operator library (was `VeriTile.Triton.Math.*`).
  "VeriTile.Math",
  "VeriTile.Math.Activation",
  "VeriTile.Math.Attention",
  "VeriTile.Math.L2Norm",
  "VeriTile.Math.LogSumExp",
  "VeriTile.Math.Loss",
  "VeriTile.Math.Optimizer",
  "VeriTile.Math.RMSNorm",
  "VeriTile.Math.Reduction",
  "VeriTile.Math.Softmax",
  # Triton frontend (syntax macros + lowering).
  "VeriTile.Frontend.Triton.+",
  "VeriTile.Examples.Common",
  "VeriTile.Examples.TritonSmoke",
  "VeriTile.Examples.MemorySafety",
  "VeriTile.Examples.MemoryFrame",
  "VeriTile.Examples.GridComposition",
  "VeriTile.Examples.AdamUpdateGridLaunch",
  "VeriTile.Examples.AttentionForwardClosedForm",
  "VeriTile.Examples.LoopInvariant",
  "VeriTile.Examples.SoftmaxEq",
  "VeriTile.Examples.LogSumExpEq",
  "VeriTile.Examples.SoftmaxReciprocal",
  "VeriTile.Examples.VectorAdd",
  "VeriTile.Examples.FusedSiLU",
  "VeriTile.Examples.RowWise",
  "VeriTile.Examples.WelfordKernels",
  "VeriTile.Examples.LayerNormKernels",
  "VeriTile.Examples.OnlineSoftmax",
  "VeriTile.Examples.HyperConnections.+",
  "VeriTile.Examples.FlashAttention1",
  "VeriTile.Examples.FlashAttention1.+",
]

# Math sub-library: Taylor and integral bounds for the GeLU error
# certificate. Pulls in heavy Mathlib analysis (`MeasureTheory`,
# `Analysis.Calculus.MeanValue`, …). The pure-math operator library also lives
# under `VeriTile.Math.*` but ships with the lite `VeriTile` lib above; this
# sub-library is only the analysis-heavy GeLU-certificate chain.
[[lean_lib]]
name = "VeriTileMath"
globs = [
  "VeriTile.Math.GeluTaylor20Cert",
  "VeriTile.Math.GeluTaylor20PolyBound",
  "VeriTile.Math.GeluTaylor20PolyDef",
  "VeriTile.Math.GeluTaylor20PolyLowerCases",
  "VeriTile.Math.GeluTaylor20PolyUpperCases",
  "VeriTile.Math.RealErf",
  "VeriTile.Math.Tanh",
]

# Full target: Lite + Math + ApproxGeLU. Build this when working on the
# GeLU error bound or before any release tagging.
[[lean_lib]]
name = "VeriTileFull"
globs = [
  "VeriTile.Examples.ApproxGeLU",
  "VeriTile.Examples.ApproxGeLU.+",
]
