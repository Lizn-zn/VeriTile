.eyebrow[Project overview]

# VeriTile

.lede[Translation validation for Triton GPU kernels, in Lean 4.]

.blurb[
Embed a small Triton-style kernel language inside Lean. Give it operational
semantics. Then prove kernel-pair refinement and end-to-end correctness against
mathematical specs — with an LLM agent driving the proofs.
]

<div class="footer"><span></span><span class="right">VeriTile · Architecture walkthrough</span></div>

---
name: motivation

.eyebrow[Motivation]
# What VeriTile sets out to do
<div class="rule"></div>

.cols.cols-2[
.card.accent-blue[
.label[The problem]
Triton powers production attention, GEMM, normalization, SSM, RoPE,
MoE routing — and yet there is no machine-checked way to certify
that an *optimized* Triton kernel computes the same thing as the
naive reference.

Engineers re-derive the algebra by hand for every variant, and a
single off-by-one (`mask=`, `other=`, partial KV block, D-tail) can
silently change results.
]
.card.accent-orange[
.label[Our approach]
- Embed a Triton-style DSL inside Lean 4.
- Give the embedded kernel formal **operational semantics**.
- Prove **kernel-pair refinement** and **correctness** against math specs.
- Use an LLM agent (`scripts/prove.sh` → `/lean4:autoprove`) to drive proofs.
]
]

<div style="height:14px"></div>

.card.accent-green[
.label[What success looks like]
A Triton engineer pastes a real `.py` kernel, annotates a math spec, and
VeriTile + LLM closes the proof. Output: a Lean theorem stating that the
kernel refines its specification — for every input, every program_id, every
tile.
.muted[ No hand-picked toy theorems. Production kernels with real loops,
masks, ND tiles, strided layouts. ]
]

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">2 / 18</span></div>

---
name: north-star

.eyebrow[Design principles]
# Four axes that must advance together
<div class="rule"></div>

.cols.cols-2[
.card.accent-blue[
.label[1 · Real DSL surface]
Accept the ops, control flow, memory and concurrency primitives that
production `.py` kernels actually use — not a minimal subset.
.muted[ DSL surface stays close to real Triton; user keeps writing
Triton, not Lean. ]
]
.card.accent-orange[
.label[2 · Production-scale algorithms]
Full FA-1 forward + backward, FA-2, fused-norm family, grouped GEMM,
SSM, RoPE, GQA / MQA / MLA — not 8 hand-picked theorems.
.muted[ Every production kernel needs forward + backward + math equivalence. ]
]
.card.accent-green[
.label[3 · Triton-user friendliness]
Move the user's delta from "rewrite into the embedding" toward
"paste-in `.py`" with near-zero changes (Python lifter is roadmap).
]
.card.accent-purple[
.label[4 · Production horizontal infra]
Algorithm/Compute split, Memory frame, Concurrency refinement,
ND-general framework — no ad-hoc dimension shortcuts.
]
]

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">3 / 18</span></div>

---
name: two-layer

.eyebrow[Architecture lock-in (since v0.2)]
# Two-layer architecture: Lean proof  ⟂  external testing
<div class="rule"></div>

.cols.cols-2[
.card.accent-blue[
.label[Algorithm layer  ·  Lean proof]
**`ProjectedCorrect ck post`**

Real / Int / Nat semantics. No IEEE rounding, no NaN.
- `eraseDType`: `fp32 → ℝ`, `int32 → ℤ`, `uint32 → ℕ`.
- Computable bit-pattern decoder for `fp32` constants.
- Existing `Kernel.Correct` proofs reused on the algorithm side.

Catches **algorithm-structure bugs** — every wrong recurrence, wrong
masking, wrong reduction is a failed Lean proof.
]
.card.accent-orange[
.label[Compute layer  ·  External testing]
**Compute-gap checking for required contracts.**

`ComputeKernel` behavior ↔ projected `AlgKernel` behavior, ε-bound match.

- Per-op / per-kernel `ComputeGapContract`.
- Recorded in Lean through `GapPolicy`.
- **Not a Lean theorem** — an externally checked bridge by design.

Catches **IEEE-754 edge cases** (NaN, denormal, overflow, fast-math).
]
]

<div style="height:6px"></div>

.card[
.label.muted[The bridge between the two layers is empirical, by design]
IEEE-754 formalization (NaN propagation, denormals, rounding modes, hardware
dot precision, fast-math, exception flags) is **permanently outside Lean
proof scope**. There is no planned bridge theorem connecting compute
execution to Lean-internal algorithm execution. *VeriTile-certified* = both
layers green.
]

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">4 / 18</span></div>

name: dsl

.eyebrow[Module · `VeriTile/Triton/DSL/`]
# DSL layer — accept Triton-like surface syntax
<div class="rule"></div>

.cols.cols-3[
.card.accent-blue[
.label[Input]
- User-written `triton { … }` blocks
- Sugars: `tl.load / tl.store / tl.dot / tl.where / tl.sum / tl.max / tl.exp / tl.arange / tl.program_id`
- Kwargs: `mask=`, `other=`, `axis=`, `keep_dims=`
- Region-polymorphic kernels via `$(xReg)`, `$(yReg)`
]
.card.accent-orange[
.label[What we did]
- `Syntax` + `Expansion`: macro elaborator desugars into typed `Op / Stmt`
- `Typing`: infers `TileDType × TileShape`, inserts `NumericDType / Broadcast` evidence
- `Metadata`: kwargs, axis, keep_dims
- Optional well-formedness checker
]
.card.accent-green[
.label[Output]
- Typed AST: `Op : TileDType → TileShape → Type`
- `Stmt` list (assigns, stores, forLoops)
- A `Kernel` record `{inputs, outputs, body}`
- Same kernel re-instantiable on any region names
]
]

```lean
def naiveSoftmaxKernel (xReg yReg : RegionName) (N : Nat) : Kernel := triton {
  pid  := tl.program_id(0)
  offs := pid * $(N) + tl.arange($(N))
  x    := tl.load($(xReg) + offs)
  e    := tl.exp(x);  s := tl.sum(e);  y := e / s
  tl.store($(yReg) + offs, y)
}
```

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">6 / 18</span></div>

name: core

.eyebrow[Module · `VeriTile/Triton/Core/`]
# Core AST — types, shapes, and the typed `Op`
<div class="rule"></div>

.cols.cols-3[
.card.accent-blue[
.label[Input]
- AST nodes from the DSL macro
- User-supplied dtype: `.real / .nat / .int / .bool`
- User-supplied shape: `.scalar / .vec n / .mat m n / ND`
]
.card.accent-orange[
.label[What we did]
- `TileDType / TileShape / TileIndex / TileCarrier`
- `Tile` = `TileIndex shape → TileCarrier dtype`
- `Op : TileDType → TileShape → Type` indexed by both — no existential wrapper
- `Stmt` is the existential boundary (assign / store / forLoop)
]
.card.accent-green[
.label[Output]
- Fully-typed kernel structure used by every layer
- Smart constructors: `Tile.scalar / Tile.vec / Tile.mat`
- `bop / uop / cop` with `NumericDType` + `Broadcast` evidence
- `Kernel = { inputs, outputs, body : List Stmt }`
]
]

```lean
inductive Op : TileDType → TileShape → Type
  | const     (x : ℝ)                            : Op .real .scalar
  | arange    (n : Nat)                          : Op .nat  (.vec n)
  | add  {α o} (h : NumericDType α)              : Op α o → Op α o → Op α o
  | load      (region) (addr : Op .nat shape)    : Op .real shape
  | dot       …
  -- Type indices flow through every layer; no dynamic tag, no recovery step.
```

name: compute-kernel

.eyebrow[Module · `VeriTile/Triton/Float/` + `Core/Ast.lean`]
# `ComputeKernel` — proof-stating surface, projects to `AlgKernel`
<div class="rule"></div>

.cols.cols-3[
.card.accent-blue[
.label[Input]
- A typed kernel that may carry `.fp32 / .int32 / .uint32` and bit-level `.const` / `.bitcast`.
- Algorithm-side statements lift via `ComputeStmt.alg`.
]
.card.accent-orange[
.label[What we did]
- `ComputeOp` constructors: `.alg`, `.const`, `.bitcast` (width-preserving)
- Computable `Float32Bits.decodeRat` for finite-normal binary32
- `ck.toAlgorithm?` traverses the body via `ComputeStmt.listToAlgorithm?`
- `GapPolicy` records whether an externally-checked compute gap is required
]
.card.accent-green[
.label[Output]
- `AlgKernel` (or `Except EraseDTypeError`)
- `ComputeKernel.ComputeCorrect`, `ComputeKernel.ComputeRefine`, `ExecCorrect`
- Failed projection ⇒ `False` — explicit, not silent
- User-facing theorems ride this surface; proofs run on the `AlgKernel` side
]
]

```lean
def ProjectedCorrect (ck : ComputeKernel) (post : AlgSpec) : Prop :=
  match ck.toAlgorithm? with
  | .ok ak  => Kernel.Correct ak post
  | .error _ => False

def ComputeCorrect (ck) (post) (gap : GapPolicy := .ignore) : Prop :=
  GapPolicy.Holds gap ∧ ProjectedCorrect ck post     -- gap = .require contract → externally checked
```

.muted.small[ `ComputeKernel` is the **proof-stating** Lean AST — it lets users state theorems on fp/int kernels and have the proof flow through `toAlgorithm?` to the algorithm side. It is **not** the differential-testing pipeline; that is external (PLAN.md §Compute-gap details). ]

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">8 / 18</span></div>

name: semantics

.eyebrow[Module · `VeriTile/Triton/Semantics/`]
# Operational semantics — `evalOp`, `stepStmt`, `exec`
<div class="rule"></div>

.cols.cols-3[
.card.accent-blue[
.label[Input]
- `AlgKernel` + initial `BlockState`
- `BlockState = mem · regs · pid · undef`
- `regs : RegFile` dependently typed by `(dtype, shape, name)`
]
.card.accent-orange[
.label[What we did]
- `evalOp : Op dtype shape → BlockState → Option (Tile dtype shape)`
- `stepStmt`, `stepStmts`, `stepForLoopAux` — mutual
- `TileOps`: scalar / vec / mat, broadcasting, reductions
- Mask + bool channel; `tl.load(p, mask, other)` lowers to separate AST
- `other = None` modeled by a per-state `undef` oracle
]
.card.accent-green[
.label[Output]
- `exec : AlgKernel → BlockState → Option BlockState`
- Deterministic except for the explicit `undef` channel
- The single source of truth used by every theorem in the project
]
]

.card[
.label.muted[Notable design choice]
**`WithBot ℝ` carrier.** `tl.full((), -inf)` lowers to true `⊥` — kernels
using `-inf` as a max-accumulator seed need **no input-range hypothesis**.
No `-1e38` stand-in.
]

name: loopinv

.eyebrow[Module · `VeriTile/Triton/LoopInvariant.lean`]
# `forLoop_inv` — the master induction lemma
<div class="rule"></div>

.cols.cols-3[
.card.accent-blue[
.label[Input]
- A loop body of type `List Stmt`
- A loop counter range `[0, n)`
- An invariant `Inv : Nat → BlockState → Prop`
- A step lemma:  `Inv k s → Inv (k+1) (run body s_with_k)`
]
.card.accent-orange[
.label[What we did]
- Bind the loop counter to an index register before each iteration — matches Triton's induction var
- Support nested loops and early-exit `None` propagation
- Pre-bake simp / cases lemmas to absorb the four known pitfalls
  ( `forLoop_unfold` eagerness · `stepStmts []` non-rfl · `if_neg` in `∧` · match cascades)
]
.card.accent-green[
.label[Output]
- A reusable `forLoop_inv` theorem — the **single entry** every loop-bearing kernel proof goes through
- Drives FA-1 forward / boundary, Welford, online-softmax, fused LayerNorm, ScoreVariants, …
]
]

.card[
.label.muted[Why a master lemma]
Every Triton kernel of interest contains at least one streaming reduction.
Without a single, well-tested loop-induction principle, every proof would
re-invent its own recursion, and every example would re-discover the same
four pitfalls. `forLoop_inv` makes the induction step the only thing the
LLM agent has to discover.
]

<div class="footer"><span class="muted">VeriTile</span><span class="right muted">10 / 18</span></div>

name: closing

.eyebrow[Takeaways]
# Why the architecture is now stable
<div class="rule"></div>

.cols.cols-2[
.card.accent-blue[
.label[End-to-end typed pipeline]
`TileDType × TileShape` index every `Op`, `Tile`, `RegFile`, `evalOp`.
No dynamic tag, no existential recovery step. The type system *is* the
soundness backbone.
]
.card.accent-orange[
.label[Two-layer split is permanent]
Algorithm correctness in Lean (`Kernel.Correct`); IEEE-754 fidelity via
external testing. The two never merge by Lean theorem — by design.
`ComputeKernel` is the in-Lean proof-stating bridge to the algorithm side
via `toAlgorithm?`.
]
.card.accent-green[
.label[Single shared interpreter]
`evalOp / stepStmt / forLoop_inv` are reused by every theorem.
Adding a new op or a new kernel has bounded blast radius.
]
.card.accent-purple[
.label[Cross-cutting subsystems plug in cleanly]
Memory · Concurrency · Launch attach to the same `BlockState`.
New primitives extend the system without rewriting existing proofs.
]
]

<div style="height:8px"></div>

.center[
**Architecture locked since v0.2** — what changes from here is theorem coverage, not foundations.
]
