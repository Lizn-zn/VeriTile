<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa6b8"/>
    </marker>
  </defs>

  <!-- ============================== ORIGINAL ============================== -->
  <text x="60" y="28" font-size="14" font-weight="700" letter-spacing="2" fill="#6e6e73">ORIGINAL</text>

  <g fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2" stroke-dasharray="5 3">
    <rect x="60"  y="40" width="160" height="80" rx="10"/>
    <rect x="260" y="40" width="160" height="80" rx="10"/>
    <rect x="460" y="40" width="160" height="80" rx="10"/>
    <rect x="660" y="40" width="160" height="80" rx="10"/>
  </g>
  <g fill="#6e6e73" font-size="20" text-anchor="middle">
    <text x="140" y="87"><tspan font-family="JetBrains Mono, Menlo, monospace" fill="#1d1d1f">.py</tspan> Kernel</text>
    <text x="340" y="75"><tspan x="340">PyTorch</tspan><tspan x="340" dy="24">Reference</tspan></text>
    <text x="540" y="75"><tspan x="540">Test: Sample</tspan><tspan x="540" dy="24">A Few Inputs</tspan></text>
    <text x="740" y="87">Ship</text>
  </g>
  <rect x="860" y="40" width="160" height="80" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="1.8"/>
  <text x="940" y="87" font-size="20" font-weight="600" text-anchor="middle" fill="#e8590c">Silent Bug?</text>

  <g stroke="#9aa6b8" stroke-width="2" fill="none">
    <line x1="222" y1="80" x2="256" y2="80" marker-end="url(#arrowGray)"/>
    <line x1="422" y1="80" x2="456" y2="80" marker-end="url(#arrowGray)"/>
    <line x1="622" y1="80" x2="656" y2="80" marker-end="url(#arrowGray)"/>
    <line x1="822" y1="80" x2="856" y2="80" marker-end="url(#arrowGray)"/>
  </g>

  <!-- ============================== VERITILE ============================== -->
  <text x="60" y="168" font-size="14" font-weight="700" letter-spacing="2" fill="#0071e3">VERITILE</text>

  <g fill="#ffffff" stroke="#0071e3" stroke-width="1.8" filter="url(#cardShadow)">
    <rect x="60"  y="180" width="160" height="80" rx="10"/>
    <rect x="260" y="180" width="160" height="80" rx="10"/>
    <rect x="460" y="180" width="160" height="80" rx="10"/>
    <rect x="660" y="180" width="160" height="80" rx="10"/>
  </g>
  <g fill="#1d1d1f" font-size="20" text-anchor="middle">
    <text x="140" y="227"><tspan font-family="JetBrains Mono, Menlo, monospace">.py</tspan> Kernel</text>
    <text x="340" y="215"><tspan x="340">Embedded</tspan><tspan x="340" dy="24">DSL</tspan></text>
    <text x="540" y="215"><tspan x="540">Lean Theorem</tspan><tspan x="540" dy="24">And Proof</tspan></text>
    <text x="740" y="227">Ship</text>
  </g>
  <rect x="860" y="180" width="160" height="80" rx="10"
        fill="#ffffff" stroke="#00a76f" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="940" y="227" font-size="20" font-weight="600" text-anchor="middle" fill="#00a76f">✓ Proven</text>

  <g stroke="#9aa6b8" stroke-width="2" fill="none">
    <line x1="222" y1="220" x2="256" y2="220" marker-end="url(#arrowGray)"/>
    <line x1="422" y1="220" x2="456" y2="220" marker-end="url(#arrowGray)"/>
    <line x1="622" y1="220" x2="656" y2="220" marker-end="url(#arrowGray)"/>
    <line x1="822" y1="220" x2="856" y2="220" marker-end="url(#arrowGray)"/>
  </g>
</svg>
